          @keyframes utt-fall {
            from {
              transform: translate3d(0, -60px, 0) rotate(0deg);
            }
            to {
              transform: translate3d(var(--dx), 920px, 0) rotate(var(--r));
            }
          }
          .utt-p {
            position: absolute;
            top: -40px;
            animation: utt-fall var(--d) linear var(--t) infinite;
            will-change: transform;
          }
          @media (prefers-reduced-motion: reduce) {
            .utt-p {
              animation: none;
              top: var(--y);
            }
          }
          @keyframes utt-twinkle {
            0%,
            100% {
              opacity: 1;
              transform: scale(1);
            }
            50% {
              opacity: 0.35;
              transform: scale(0.72);
            }
          }
          .utt-tw {
            display: block;
            animation: utt-twinkle var(--tw) ease-in-out var(--td) infinite;
          }
          @media (prefers-reduced-motion: reduce) {
            .utt-tw {
              animation: none;
            }
          }
        </style>
