<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Listes — se connecter pour réserver</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <link
          href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap"
          rel="stylesheet"
        />
        <style>
          body {
            margin: 0;
          }
          a {
            color: #c93425;
          }
          a:hover {
            color: #c93425;
          }
        </style>
      </helmet>
      <div
        style="
          width: 390px;
          height: 844px;
          box-sizing: border-box;
          background: #a8959d;
          color: #2b1b3d;
          font-family: 'DM Sans', system-ui, sans-serif;
          display: flex;
          flex-direction: column;
          justify-content: flex-end;
        "
      >
        <div
          aria-hidden="true"
          style="
            height: 330px;
            flex-shrink: 0;
            padding: 20px 16px;
            box-sizing: border-box;
            font-family: 'Outfit', system-ui, sans-serif;
            font-weight: 700;
            font-size: 30px;
            color: #6b5661;
          "
        >
          Noël 2026
        </div>
        <section
          aria-label="Se connecter pour réserver"
          style="
            flex-grow: 1;
            background: #ffffff;
            border-radius: 32px 32px 0 0;
            padding: 10px 16px 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
          "
        >
          <span
            aria-hidden="true"
            style="
              align-self: center;
              width: 44px;
              height: 5px;
              border-radius: 999px;
              background: #ffd9cc;
            "
          ></span>
          <div style="display: flex; flex-direction: column; gap: 4px">
            <h1
              style="
                margin: 0;
                font-family: 'Outfit', system-ui, sans-serif;
                font-weight: 700;
                font-size: 24px;
                line-height: 1.15;
              "
            >
              Ton adresse email, pour réserver
            </h1>
            <p
              style="
                margin: 0;
                font-size: 15px;
                line-height: 1.45;
                color: #6b5a7a;
              "
            >
              Elle sert à retrouver tes réservations et à les annuler. Pas de
              mot de passe : tu reçois un lien.
            </p>
          </div>
          <div style="display: flex; flex-direction: column; gap: 6px">
            <label for="e" style="font-size: 15px; font-weight: 600"
              >Adresse email</label
            ><input
              id="e"
              placeholder="toi@exemple.fr"
              style="
                height: 48px;
                box-sizing: border-box;
                padding: 0 12px;
                border: 1px solid #f5b8a5;
                border-radius: 16px;
                background: #ffffff;
                color: #2b1b3d;
                font-family: inherit;
                font-size: 16px;
                width: 100%;
              "
            />
          </div>
          <div style="display: flex; flex-direction: column; gap: 6px">
            <label for="f" style="font-size: 15px; font-weight: 600"
              >Ton prénom (facultatif)</label
            ><input
              id="f"
              placeholder="Pour que Camille sache que c’est toi"
              style="
                height: 48px;
                box-sizing: border-box;
                padding: 0 12px;
                border: 1px solid #f5b8a5;
                border-radius: 16px;
                background: #ffffff;
                color: #2b1b3d;
                font-family: inherit;
                font-size: 16px;
                width: 100%;
              "
            />
            <p
              style="
                margin: 0;
                font-size: 13px;
                line-height: 1.4;
                color: #6b5a7a;
              "
            >
              Sans prénom, tu coches en anonyme : personne ne saura que c’est
              toi.
            </p>
          </div>
          <div
            style="
              margin-top: auto;
              display: flex;
              flex-direction: column;
              gap: 6px;
            "
          >
            <button
              style="
                height: 52px;
                border: 0;
                border-radius: 16px;
                background: #d93a2b;
                color: #ffffff;
                font-family: inherit;
                font-size: 17px;
                font-weight: 700;
                text-decoration: none;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                width: 100%;
              "
            >
              Recevoir mon lien
            </button>
            <p
              style="
                margin: 0;
                text-align: center;
                font-size: 13px;
                line-height: 1.4;
                color: #6b5a7a;
              "
            >
              Le circuit de billes t’attend : tu le réserves en revenant.
            </p>
          </div>
        </section>
      </div>
    </x-dc>
    <script
      type="text/x-dc"
      data-dc-script
      data-props='{"$preview":{"width":390,"height":1500}}'
    >
      class Component extends DCLogic {
      renderVals() {
      return {};
      }
      }
    </script>
  </body>
</html>
