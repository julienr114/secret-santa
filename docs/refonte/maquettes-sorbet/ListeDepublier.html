<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Listes — dépublier</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <link
          href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap"
          rel="stylesheet"
        />
        <style>
          body {
            margin: 0;
          }
          a {
            color: #c93425;
          }
          a:hover {
            color: #c93425;
          }
        </style>
      </helmet>
      <div
        style="
          width: 390px;
          height: 844px;
          box-sizing: border-box;
          background: #a8959d;
          color: #2b1b3d;
          font-family: 'DM Sans', system-ui, sans-serif;
          display: flex;
          flex-direction: column;
          justify-content: flex-end;
        "
      >
        <div
          aria-hidden="true"
          style="
            height: 260px;
            flex-shrink: 0;
            padding: 20px 16px;
            box-sizing: border-box;
            font-family: 'Outfit', system-ui, sans-serif;
            font-weight: 700;
            font-size: 30px;
            color: #6b5661;
          "
        >
          Noël 2026
        </div>
        <section
          aria-label="Dépublier la liste"
          style="
            flex-grow: 1;
            background: #ffffff;
            border-radius: 32px 32px 0 0;
            padding: 10px 16px 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
          "
        >
          <span
            aria-hidden="true"
            style="
              align-self: center;
              width: 44px;
              height: 5px;
              border-radius: 999px;
              background: #ffd9cc;
            "
          ></span>
          <h2
            style="
              margin: 0;
              font-family: 'Outfit', system-ui, sans-serif;
              font-weight: 700;
              font-size: 24px;
              line-height: 1.2;
            "
          >
            Dépublier la liste ?
          </h2>
          <p style="margin: 0; font-size: 16px; line-height: 1.5">
            Le lien ne marchera plus : ceux qui l’ouvrent verront « Cette liste
            n’est plus publiée ». Ceux qui l’avaient ouverte connectés ne la
            verront plus dans leurs listes.
          </p>
          <ul
            style="
              list-style: none;
              margin: 0;
              padding: 0;
              display: flex;
              flex-direction: column;
              gap: 8px;
              font-size: 15px;
              line-height: 1.45;
              color: #6b5a7a;
            "
          >
            <li>Les cadeaux déjà cochés le restent.</li>
            <li>Si tu la republies, le même lien remarche.</li>
          </ul>
          <div
            style="
              display: flex;
              flex-direction: column;
              gap: 10px;
              margin-top: auto;
            "
          >
            <button
              style="
                height: 52px;
                border: 0;
                border-radius: 16px;
                background: #d93a2b;
                color: #ffffff;
                font-family: inherit;
                font-size: 17px;
                font-weight: 700;
                text-decoration: none;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                background: #a12a2a;
              "
            >
              Dépublier</button
            ><a
              href="ListePublication.dc.html"
              style="
                height: 48px;
                box-sizing: border-box;
                border: 1px solid #d93a2b;
                border-radius: 16px;
                background: transparent;
                color: #c93425;
                font-family: inherit;
                font-size: 16px;
                font-weight: 700;
                text-decoration: none;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
              "
              >Annuler</a
            >
          </div>
        </section>
      </div>
    </x-dc>
    <script
      type="text/x-dc"
      data-dc-script
      data-props='{"$preview":{"width":390,"height":844}}'
    >
      class Component extends DCLogic {
      renderVals() {
      return {};
      }
      }
    </script>
  </body>
</html>
