<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Listes — par personne, ou une seule liste</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <link
          href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap"
          rel="stylesheet"
        />
        <style>
          body {
            margin: 0;
          }
          a {
            color: #c93425;
          }
          a:hover {
            color: #c93425;
          }
        </style>
      </helmet>
      <div
        style="
          width: 390px;
          height: 980px;
          box-sizing: border-box;
          background: #fff6f1;
          color: #2b1b3d;
          font-family: 'DM Sans', system-ui, sans-serif;
          display: flex;
          flex-direction: column;
        "
      >
        <header
          style="
            height: 56px;
            flex-shrink: 0;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding: 0 12px;
          "
        >
          <div>
            <button
              aria-label="Retour"
              style="
                width: 44px;
                height: 44px;
                border: 0;
                background: transparent;
                color: #2b1b3d;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 0;
              "
            >
              <svg
                aria-hidden="true"
                width="22"
                height="22"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="m15 18-6-6 6-6" />
              </svg>
            </button>
          </div>
          <div
            style="
              display: flex;
              align-items: center;
              gap: 6px;
              font-family: 'Outfit', system-ui, sans-serif;
              font-weight: 700;
              font-size: 18px;
              color: #c93425;
            "
          >
            <svg
              aria-hidden="true"
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="currentColor"
            >
              <path
                d="M12 2l2.2 7.8L22 12l-7.8 2.2L12 22l-2.2-7.8L2 12l7.8-2.2z"
              /></svg
            >Under the Tree
          </div>
          <button
            aria-label="Langue : français"
            style="
              justify-self: end;
              height: 44px;
              min-width: 44px;
              border: 0;
              background: transparent;
              color: #2b1b3d;
              font-family: inherit;
              font-size: 14px;
              font-weight: 600;
            "
          >
            FR
          </button>
        </header>
        <main
          style="
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 8px 16px 24px;
          "
        >
          <div
            style="
              min-height: 52px;
              box-sizing: border-box;
              padding: 6px 6px 6px 14px;
              border-radius: 999px;
              background: #ffffff;
              box-shadow: 0 0 0 1px #ffd9cc;
              display: flex;
              align-items: center;
              gap: 10px;
            "
          >
            <a
              href="ListePublication.dc.html"
              style="
                flex-grow: 1;
                min-width: 0;
                min-height: 40px;
                display: flex;
                align-items: center;
                gap: 10px;
                text-decoration: none;
                color: #2b1b3d;
              "
              ><span
                aria-hidden="true"
                style="
                  width: 10px;
                  height: 10px;
                  border-radius: 50%;
                  background: #f5b8a5;
                  flex-shrink: 0;
                "
              ></span
              ><span style="font-size: 14px; font-weight: 700"
                >Brouillon · toi seul la vois</span
              ></a
            ><a
              href="ListePublier.dc.html"
              style="
                height: 36px;
                padding: 0 14px;
                border-radius: 999px;
                background: #d93a2b;
                color: #ffffff;
                text-decoration: none;
                font-size: 14px;
                font-weight: 700;
                display: flex;
                align-items: center;
                gap: 6px;
                flex-shrink: 0;
              "
              ><svg
                aria-hidden="true"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="12" cy="12" r="9" />
                <path
                  d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"
                /></svg
              >Publier</a
            >
          </div>
          <div style="display: flex; flex-direction: column; gap: 10px">
            <span
              aria-hidden="true"
              style="
                width: 72px;
                height: 72px;
                border-radius: 22px;
                background: linear-gradient(150deg, #e6d6f8 0%, #b993dd 110%);
                box-shadow:
                  0 0 0 4px #ffffff,
                  0 3px 8px rgba(90, 40, 60, 0.22);
                transform: rotate(-3deg);
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 37px;
                line-height: 1;
                flex-shrink: 0;
              "
              >💍</span
            >
            <h1
              style="
                margin: 4px 0 0;
                font-family: 'Outfit', system-ui, sans-serif;
                font-weight: 700;
                font-size: 34px;
                line-height: 1.1;
              "
            >
              Le mariage de Camille et Hugo
            </h1>
            <p
              style="
                margin: 0;
                font-size: 15px;
                line-height: 1.4;
                color: #c93425;
                font-weight: 700;
              "
            >
              Ajouter une date
            </p>
          </div>
          <fieldset
            style="
              margin: 0;
              padding: 0;
              border: 0;
              display: flex;
              flex-direction: column;
              gap: 10px;
            "
          >
            <legend
              style="
                padding: 0 0 10px;
                font-family: 'Outfit', system-ui, sans-serif;
                font-weight: 700;
                font-size: 22px;
                line-height: 1.2;
              "
            >
              Comment ranger les idées ?
            </legend>
            <label
              style="
                display: flex;
                align-items: flex-start;
                gap: 12px;
                padding: 14px;
                border-radius: 18px;
                background: #ffffff;
                box-shadow: 0 0 0 1px #ffd9cc;
              "
              ><input
                type="radio"
                name="forme"
                style="
                  width: 22px;
                  height: 22px;
                  margin: 1px 0 0;
                  accent-color: #d93a2b;
                  flex-shrink: 0;
                "
              /><span style="display: flex; flex-direction: column; gap: 2px"
                ><span style="font-size: 16px; font-weight: 700"
                  >Par personne</span
                ><span style="font-size: 14px; line-height: 1.4; color: #6b5a7a"
                  >Noël, les anniversaires : une partie pour chacun, avec ses
                  goûts et ses tailles.</span
                ></span
              ></label
            >
            <label
              style="
                display: flex;
                align-items: flex-start;
                gap: 12px;
                padding: 14px;
                border-radius: 18px;
                background: #ffffff;
                box-shadow: 0 0 0 2px #d93a2b;
              "
              ><input
                type="radio"
                name="forme"
                checked
                style="
                  width: 22px;
                  height: 22px;
                  margin: 1px 0 0;
                  accent-color: #d93a2b;
                  flex-shrink: 0;
                "
              /><span style="display: flex; flex-direction: column; gap: 2px"
                ><span style="font-size: 16px; font-weight: 700"
                  >Une seule liste</span
                ><span style="font-size: 14px; line-height: 1.4; color: #6b5a7a"
                  >Un mariage, une crémaillère, une naissance : les idées, l’une
                  sous l’autre.</span
                ></span
              ></label
            >
          </fieldset>
          <p
            style="
              margin: 0;
              font-size: 14px;
              line-height: 1.45;
              color: #6b5a7a;
            "
          >
            Tu pourras changer tant que la liste n’est pas publiée.
          </p>
        </main>
      </div>
    </x-dc>
    <script
      type="text/x-dc"
      data-dc-script
      data-props='{"$preview":{"width":390,"height":980}}'
    >
      class Component extends DCLogic {
      renderVals() {
      return {};
      }
      }
    </script>
  </body>
</html>
