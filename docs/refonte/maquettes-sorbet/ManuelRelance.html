<!doctype html>

  <head>
    <meta charset="utf-8" />
    <title>Tirage déjà fait — message de relance</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <link
          href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap"

        <style>

          }
        </style>
      </helmet>
      <div
        style="

          height: 844px;
          box-sizing: border-box;
          background: #a8959d;
          color: #2b1b3d;
          font-family: 'DM Sans', system-ui, sans-serif;
          display: flex;
          flex-direction: column;
          justify-content: flex-end;
        "
      >
        <div
          aria-hidden="true"
          style="
            height: 88px;
            flex-shrink: 0;
            padding: 20px 16px;
            box-sizing: border-box;
            font-family: 'Outfit', system-ui, sans-serif;
            font-weight: 700;
            font-size: 30px;
            color: #6b5661;
          "
        >
          Noël 2026
        </div>

        <section
          aria-label="Relancer Louis"
          style="
            flex-grow: 1;
            background: #ffffff;
            border-radius: 32px 32px 0 0;
            padding: 10px 16px 24px;
            display: flex;
            flex-direction: column;
            gap: 18px;
          "
        >
          <span
            aria-hidden="true"
            style="
              align-self: center;
              width: 44px;
              height: 5px;
              border-radius: 999px;
              background: #ffd9cc;

          <div style="display: flex; align-items: center; gap: 12px">
            <span

                  150deg,
                  #ffffff 0%,
                  #ffe9a8 42%,
                  #f4b82e 135%
                );
                box-shadow:
                  0 0 0 2px #ffffff,
                  0 3px 8px rgba(90, 40, 60, 0.22);
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 22px;
                flex-shrink: 0;
              "
              >🎄</span
            >
            <div
              style="
                flex-grow: 1;
                display: flex;
                flex-direction: column;
                gap: 2px;
              "
            >
              <h1
                style="
                  margin: 0;
                  font-family: 'Outfit', system-ui, sans-serif;
                  font-weight: 700;
                  font-size: 22px;
                  line-height: 1.15;
                "
              >
                Relancer Louis
              </h1>
              <p style="margin: 0; font-size: 14px; color: #6b5a7a">
                Demandé le 14 novembre, pas encore répondu
              </p>
            </div>
            <button
              aria-label="Fermer"
              style="
                width: 44px;
                height: 44px;
                border: 0;
                border-radius: 50%;
                background: #ffeae1;
                color: #2b1b3d;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 0;
              "
            >
              <svg
                aria-hidden="true"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.2"
                stroke-linecap="round"
              >
                <path d="M6 6l12 12M18 6 6 18" />
              </svg>
            </button>
          </div>

          <div
            role="radiogroup"
            aria-label="Message"
            style="
              display: grid;
              grid-template-columns: repeat(3, minmax(0, 1fr));
              gap: 4px;
              padding: 4px;
              border-radius: 16px;
              background: #ffeae1;
            "
          >
            <button
              role="radio"
              aria-checked="false"
              style="
                height: 40px;
                border: 0;
                border-radius: 10px;
                background: transparent;
                color: #6b5a7a;
                font-family: inherit;
                font-size: 14px;
                font-weight: 600;
              "
            >
              Demande
            </button>
            <button
              role="radio"
              aria-checked="true"
              style="
                height: 40px;
                border: 0;
                border-radius: 10px;
                background: #ffffff;
                box-shadow: 0 1px 2px rgba(90, 40, 60, 0.12);
                color: #2b1b3d;
                font-family: inherit;
                font-size: 14px;
                font-weight: 700;
              "
            >
              Relance
            </button>
            <button
              role="radio"
              aria-checked="false"
              style="
                height: 40px;
                border: 0;
                border-radius: 10px;
                background: transparent;
                color: #6b5a7a;
                font-family: inherit;
                font-size: 14px;
                font-weight: 600;
              "
            >
              À vérifier
            </button>
          </div>

          <div style="display: flex; flex-direction: column; gap: 8px">
            <div
              style="
                align-self: flex-start;
                max-width: 92%;
                background: #ffeae1;
                border-radius: 24px 24px 24px 6px;
                padding: 12px 14px;
                display: flex;
                flex-direction: column;
                gap: 6px;
                font-size: 15px;
                line-height: 1.45;
              "
            >
              <p style="margin: 0">
                Louis, on n’attend plus que toi ! 🎁 Dis à qui tu offres un
                cadeau : dès que tout le monde a répondu, chacun voit les idées
                de sa personne.
              </p>
              <p style="margin: 0; font-weight: 600; color: #c93425">
                under-the-tree.party/p/aIFR…
              </p>
            </div>
            <div
              style="
                display: flex;
                align-items: center;
                gap: 8px;
                flex-wrap: wrap;
              "
            >
              <button
                style="
                  height: 40px;
                  padding: 0 12px;
                  box-sizing: border-box;
                  border: 1px solid #ffd9cc;
                  border-radius: 999px;
                  background: transparent;
                  color: #2b1b3d;
                  font-family: inherit;
                  font-size: 14px;
                  font-weight: 600;
                  display: flex;
                  align-items: center;
                  gap: 6px;
                "
              >
                <svg
                  aria-hidden="true"
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z" />
                </svg>
                Ajouter un mot
              </button>
              <button
                aria-label="Langue du message : français. Changer"
                style="
                  height: 40px;
                  padding: 0 12px;
                  box-sizing: border-box;
                  border: 1px solid #ffd9cc;
                  border-radius: 999px;
                  background: transparent;
                  color: #2b1b3d;
                  font-family: inherit;
                  font-size: 14px;
                  font-weight: 600;
                  display: flex;
                  align-items: center;
                  gap: 6px;
                "
              >
                <svg
                  aria-hidden="true"
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <circle cx="12" cy="12" r="9" />
                  <path
                    d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"
                  />
                </svg>
                Français
                <svg
                  aria-hidden="true"
                  width="14"
                  height="14"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="m6 9 6 6 6-6" />
                </svg>
              </button>
            </div>
          </div>

          <div
            style="
              margin-top: auto;
              display: flex;
              flex-direction: column;
              gap: 10px;
            "
          >
            <button
              style="
                width: 100%;
                min-height: 56px;
                padding: 6px 12px;
                border: 0;
                border-radius: 16px;
                background: #d93a2b;
                color: #ffffff;
                font-family: inherit;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 10px;
              "
            >
              <svg
                aria-hidden="true"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect x="2" y="4" width="20" height="16" rx="2" />
                <path d="m22 7-10 6L2 7" />
              </svg>
              <span
                style="
                  display: flex;
                  flex-direction: column;
                  align-items: flex-start;
                "
              >
                <span
                  style="font-size: 17px; font-weight: 700; line-height: 1.2"
                  >Envoyer par email</span
                >
                <span
                  style="font-size: 13px; font-weight: 500; line-height: 1.2"
                  >louis-demo@example.com</span
                >
              </span>
            </button>
            <div
              style="
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 10px;
              "
            >
              <button
                style="
                  height: 46px;
                  box-sizing: border-box;
                  border: 1px solid #ffd9cc;
                  border-radius: 16px;
                  background: transparent;
                  color: #2b1b3d;
                  font-family: inherit;
                  font-size: 15px;
                  font-weight: 600;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  gap: 8px;
                "
              >
                <svg
                  aria-hidden="true"
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <circle cx="18" cy="5" r="3" />
                  <circle cx="6" cy="12" r="3" />
                  <circle cx="18" cy="19" r="3" />
                  <path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4" />
                </svg>
                Partager
              </button>
              <button
                style="
                  height: 46px;
                  box-sizing: border-box;
                  border: 1px solid #ffd9cc;
                  border-radius: 16px;
                  background: transparent;
                  color: #2b1b3d;
                  font-family: inherit;
                  font-size: 15px;
                  font-weight: 600;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  gap: 8px;
                "
              >
                <svg
                  aria-hidden="true"
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"

                Copier
              </button>
            </div>
          </div>
        </section>
      </div>
    </x-dc>
    <script
      type="text/x-dc"
      data-dc-script
      data-props='{"$preview":{"width":390,"height":844}}'
