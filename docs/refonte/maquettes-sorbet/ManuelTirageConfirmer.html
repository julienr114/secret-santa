<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Page d’un tirage — confirmer sa réponse</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <link
          href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap"
          rel="stylesheet"
        />
        <style>
          body {
            margin: 0;
          }
          a {
            color: #c93425;
          }
          a:hover {
            color: #c93425;
          }
        </style>
      </helmet>
      <div
        style="
          width: 390px;
          height: 844px;
          box-sizing: border-box;
          background: #a8959d;
          color: #2b1b3d;
          font-family: 'DM Sans', system-ui, sans-serif;
          display: flex;
          flex-direction: column;
          justify-content: flex-end;
        "
      >
        <div
          aria-hidden="true"
          style="
            height: 330px;
            flex-shrink: 0;
            padding: 20px 16px;
            box-sizing: border-box;
            font-family: 'Outfit', system-ui, sans-serif;
            font-weight: 700;
            font-size: 30px;
            color: #6b5661;
          "
        >
          Salut Camille !
        </div>
        <section
          aria-label="Confirmer ma réponse"
          style="
            flex-grow: 1;
            background: #ffffff;
            border-radius: 32px 32px 0 0;
            padding: 10px 16px 24px;
            display: flex;
            flex-direction: column;
            gap: 18px;
          "
        >
          <span
            aria-hidden="true"
            style="
              align-self: center;
              width: 44px;
              height: 5px;
              border-radius: 999px;
              background: #ffd9cc;
            "
          ></span>
          <div
            style="
              display: flex;
              flex-direction: column;
              align-items: center;
              gap: 8px;
              padding-top: 8px;
            "
          >
            <span
              aria-hidden="true"
              style="
                width: 80px;
                height: 80px;
                border-radius: 50%;
                background: linear-gradient(
                  150deg,
                  #ffffff 0%,
                  #ffe9a8 42%,
                  #f4b82e 135%
                );
                box-shadow:
                  0 0 0 4px #ffffff,
                  0 3px 8px rgba(90, 40, 60, 0.22);
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 38px;
                flex-shrink: 0;
              "
              >🎄</span
            >
          </div>
          <div style="display: flex; flex-direction: column; gap: 4px">
            <h1
              style="
                margin: 0;
                font-family: 'Outfit', system-ui, sans-serif;
                font-weight: 700;
                font-size: 24px;
                line-height: 1.15;
              "
            >
              Tu offres un cadeau à Louis ?
            </h1>
            <p
              style="
                margin: 0;
                font-size: 15px;
                line-height: 1.45;
                color: #6b5a7a;
              "
            >
              Vérifie bien : c’est la personne que tu as tirée, sur papier ou
              dans l’autre application.
            </p>
          </div>

          <p
            style="
              margin: 0;
              font-size: 14px;
              line-height: 1.45;
              color: #6b5a7a;
            "
          >
            Tu pourras corriger ta réponse tant que l’organisateur n’a pas
            validé le tirage. Personne d’autre ne la voit.
          </p>
          <div
            style="
              margin-top: auto;
              display: flex;
              flex-direction: column;
              gap: 6px;
            "
          >
            <button
              style="
                width: 100%;
                height: 52px;
                border: 0;
                border-radius: 16px;
                background: #d93a2b;
                color: #ffffff;
                font-family: inherit;
                font-size: 17px;
                font-weight: 700;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
              "
            >
              Oui, c’est Louis
            </button>
            <a
              href="#"
              style="
                height: 46px;
                border-radius: 16px;
                color: #2b1b3d;
                font-size: 16px;
                font-weight: 600;
                text-decoration: none;
                display: flex;
                align-items: center;
                justify-content: center;
              "
              >Choisir quelqu’un d’autre</a
            >
          </div>
        </section>
      </div>
    </x-dc>
    <script
      type="text/x-dc"
      data-dc-script
      data-props='{"$preview":{"width":390,"height":844}}'
    >
      class Component extends DCLogic {
      renderVals() {
      return {};
      }
      }
    </script>
  </body>
</html>
