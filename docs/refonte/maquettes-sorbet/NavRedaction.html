<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Navigation — une page où l’on rédige</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <link
          href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap"
          rel="stylesheet"
        />
        <style>
          body {
            margin: 0;
          }
          a {
            color: #c93425;
          }
          a:hover {
            color: #c93425;
          }
        </style>
      </helmet>
      <div
        style="
          width: 390px;
          height: 844px;
          box-sizing: border-box;
          background: #fff6f1;
          color: #2b1b3d;
          font-family: 'DM Sans', system-ui, sans-serif;
          display: flex;
          flex-direction: column;
        "
      >
        <header
          style="
            height: 56px;
            flex-shrink: 0;
            box-sizing: border-box;
            border-bottom: 1px solid #ffd9cc;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding: 0 12px;
          "
        >
          <div>
            <button
              aria-label="Retour"
              style="
                width: 44px;
                height: 44px;
                border: 0;
                background: transparent;
                color: #2b1b3d;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 0;
              "
            >
              <svg
                aria-hidden="true"
                width="22"
                height="22"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="m15 18-6-6 6-6" />
              </svg>
            </button>
          </div>
          <div
            style="
              display: flex;
              align-items: center;
              gap: 6px;
              font-family: 'Outfit', system-ui, sans-serif;
              font-weight: 700;
              font-size: 18px;
              color: #c93425;
            "
          >
            <svg
              aria-hidden="true"
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="currentColor"
            >
              <path
                d="M12 2l2.2 7.8L22 12l-7.8 2.2L12 22l-2.2-7.8L2 12l7.8-2.2z"
              />
            </svg>
            Under the Tree
          </div>
          <button
            aria-label="Menu"
            style="
              justify-self: end;
              width: 44px;
              height: 44px;
              border: 0;
              background: transparent;
              color: #2b1b3d;
              display: flex;
              align-items: center;
              justify-content: center;
              padding: 0;
            "
          >
            <svg
              aria-hidden="true"
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            >
              <path d="M4 6h16M4 12h16M4 18h16" />
            </svg>
          </button>
        </header>

        <main
          style="
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 24px;
            padding: 20px 16px 24px;
          "
        >
          <div style="display: flex; flex-direction: column; gap: 4px">
            <nav
              aria-label="Tu es ici"
              style="
                margin: -14px 0 -12px;
                display: flex;
                align-items: center;
                gap: 6px;
                color: #6b5a7a;
              "
            >
              <a
                href="#"
                style="
                  min-height: 44px;
                  display: flex;
                  align-items: center;
                  font-size: 14px;
                  font-weight: 600;
                  color: #6b5a7a;
                  text-decoration: none;
                "
                >Famille Camille</a
              ><span aria-hidden="true">·</span
              ><a
                href="#"
                style="
                  min-height: 44px;
                  display: flex;
                  align-items: center;
                  font-size: 14px;
                  font-weight: 600;
                  color: #6b5a7a;
                  text-decoration: none;
                "
                >Noël 2026</a
              >
            </nav>
            <h1
              style="
                margin: 0;
                font-family: 'Outfit', system-ui, sans-serif;
                font-weight: 700;
                font-size: 30px;
                line-height: 1.1;
              "
            >
              En ce moment
            </h1>
            <p
              style="
                margin: 0;
                font-size: 15px;
                line-height: 1.45;
                color: #6b5a7a;
              "
            >
              Ce qui t’occupe ou te fait envie ces temps-ci. Pas besoin d’objets
              précis.
            </p>
          </div>
          <div style="display: flex; flex-direction: column; gap: 6px">
            <label
              for="t"
              style="
                margin: 0;
                padding: 0 4px;
                font-family: inherit;
                font-size: 12px;
                font-weight: 700;
                letter-spacing: 0.04em;
                text-transform: uppercase;
                color: #6b5a7a;
              "
              >En ce moment</label
            >
            <textarea
              id="t"
              rows="5"
              placeholder="Un loisir qui démarre, une lecture, un projet…"
              style="
                width: 100%;
                min-height: 144px;
                box-sizing: border-box;
                padding: 12px;
                border: 1px solid #f5b8a5;
                border-radius: 16px;
                background: #ffffff;
                color: #2b1b3d;
                font-family: inherit;
                font-size: 16px;
                line-height: 1.45;
                resize: none;
              "
            >
Je me mets à la course à pied, je lis des BD et je cuisine le dimanche.</textarea>
            <p
              style="
                margin: 0;
                padding: 0 4px;
                display: flex;
                justify-content: space-between;
                gap: 12px;
                font-size: 13px;
                line-height: 1.4;
                color: #6b5a7a;
              "
            >
              <span>Seul ton Père Noël lira ces lignes.</span
              ><span style="flex-shrink: 0">71 / 300</span>
            </p>
          </div>
          <div style="margin-top: 8px">
            <button
              style="
                width: 100%;
                height: 52px;
                border: 0;
                border-radius: 16px;
                background: #d93a2b;
                color: #ffffff;
                font-family: inherit;
                font-size: 17px;
                font-weight: 700;
              "
            >
              Valider
            </button>
          </div>
        </main>
        <nav
          aria-label="Sections"
          style="
            flex-shrink: 0;
            display: flex;
            background: #ffffff;
            border-top: 1px solid #ffd9cc;
          "
        >
          <a
            href="Accueil.dc.html"
            aria-current="page"
            style="
              flex: 1;
              min-height: 56px;
              display: flex;
              flex-direction: column;
              align-items: center;
              justify-content: center;
              gap: 2px;
              text-decoration: none;
              color: #c93425;
              font-size: 12px;
              font-weight: 700;
            "
            ><svg
              aria-hidden="true"
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="3" y="5" width="18" height="14" rx="2" />
              <path d="m3 7 9 7 9-7" /></svg
            >Tirages</a
          ><a
            href="ListesAccueil.dc.html"
            style="
              flex: 1;
              min-height: 56px;
              display: flex;
              flex-direction: column;
              align-items: center;
              justify-content: center;
              gap: 2px;
              text-decoration: none;
              color: #6b5a7a;
              font-size: 12px;
              font-weight: 600;
            "
            ><svg
              aria-hidden="true"
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="m3 17 2 2 4-4M3 7l2 2 4-4M13 6h8M13 12h8M13 18h8" /></svg
            >Listes</a
          >
        </nav>
      </div>
    </x-dc>
    <script
      type="text/x-dc"
      data-dc-script
      data-props='{"$preview":{"width":390,"height":900}}'
    >
      class Component extends DCLogic {
      renderVals() {
      return {};
      }
      }
    </script>
  </body>
</html>
