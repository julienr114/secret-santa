<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>
      Panneau — demander un groupe — remplacée par DemandeGroupe (Correction 18)
    </title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <link
          href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap"
          rel="stylesheet"
        />
        <style>
          body {
            margin: 0;
          }
          a {
            color: #c93425;
          }
          a:hover {
            color: #c93425;
          }
        </style>
      </helmet>
      <div
        style="
          width: 390px;
          height: 844px;
          box-sizing: border-box;
          background: #a8959d;
          color: #2b1b3d;
          font-family: 'DM Sans', system-ui, sans-serif;
          display: flex;
          flex-direction: column;
          justify-content: flex-end;
        "
      >
        <div
          aria-hidden="true"
          style="
            height: 170px;
            flex-shrink: 0;
            padding: 20px 16px;
            box-sizing: border-box;
            font-family: 'Outfit', system-ui, sans-serif;
            font-weight: 700;
            font-size: 30px;
            color: #6b5661;
          "
        >
          Bonjour Hugo
        </div>

        <section
          aria-label="Organiser un tirage"
          style="
            flex-grow: 1;
            background: #ffffff;
            border-radius: 32px 32px 0 0;
            padding: 10px 16px 24px;
            display: flex;
            flex-direction: column;
            gap: 18px;
          "
        >
          <span
            aria-hidden="true"
            style="
              align-self: center;
              width: 44px;
              height: 5px;
              border-radius: 999px;
              background: #ffd9cc;
            "
          ></span>
          <div style="display: flex; flex-direction: column; gap: 4px">
            <h1
              style="
                margin: 0;
                font-family: 'Outfit', system-ui, sans-serif;
                font-weight: 700;
                font-size: 24px;
                line-height: 1.15;
              "
            >
              Organiser un tirage
            </h1>
            <p
              style="
                margin: 0;
                font-size: 15px;
                line-height: 1.45;
                color: #6b5a7a;
              "
            >
              Pour qui veux-tu organiser un tirage ?
            </p>
          </div>
          <div
            style="
              display: flex;
              align-items: flex-start;
              gap: 10px;
              padding: 12px 14px;
              border-radius: 18px;
              background: #f1e8fc;
              box-shadow: 0 0 0 1px #cbb2ee;
              color: #6a3db3;
              font-size: 14px;
              line-height: 1.45;
            "
          >
            <span
              aria-hidden="true"
              style="display: flex; margin-top: 1px; color: #6a3db3"
              ><svg
                aria-hidden="true"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="12" cy="12" r="9" />
                <path d="M12 11v5M12 8h.010" /></svg
            ></span>
            <span
              ><strong style="color: #3b2463">Pourquoi une demande ?</strong>
              Under the Tree est en bêta : la création de groupes se fait sur
              demande, le temps de vérifier que tout fonctionne bien. Un
              administrateur lit chaque demande et te répond par email.</span
            >
          </div>
          <div style="display: flex; flex-direction: column; gap: 6px">
            <label for="req" style="font-size: 15px; font-weight: 600"
              >Ta demande</label
            >
            <textarea
              id="req"
              rows="4"
              placeholder="Le Noël de ma famille, une douzaine de personnes."
              style="
                box-sizing: border-box;
                width: 100%;
                padding: 10px 12px;
                border: 2px solid #d93a2b;
                border-radius: 16px;
                background: #ffffff;
                color: #2b1b3d;
                font-family: inherit;
                font-size: 16px;
                line-height: 1.4;
                resize: none;
              "
            ></textarea>
            <p
              style="
                margin: 0;
                text-align: right;
                font-size: 13px;
                color: #6b5a7a;
              "
            >
              0 / 500
            </p>
          </div>
          <div
            style="
              margin-top: auto;
              display: flex;
              flex-direction: column;
              gap: 6px;
            "
          >
            <button
              style="
                width: 100%;
                height: 52px;
                border: 0;
                border-radius: 16px;
                background: #d93a2b;
                color: #ffffff;
                font-family: inherit;
                font-size: 17px;
                font-weight: 700;
              "
            >
              Envoyer ma demande
            </button>
            <a
              href="AccueilPlusieurs.dc.html"
              style="
                height: 46px;
                border-radius: 16px;
                color: #2b1b3d;
                font-size: 16px;
                font-weight: 600;
                text-decoration: none;
                display: flex;
                align-items: center;
                justify-content: center;
              "
              >Annuler</a
            >
          </div>
        </section>
      </div>
    </x-dc>

      data-dc-script
      data-props='{"$preview":{"width":390,"height":844}}'
    >
