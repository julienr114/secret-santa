<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Panneau — nouvelle exclusion</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <link
          href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap"
          rel="stylesheet"
        />
        <style>
          body {
            margin: 0;
          }
          a {
            color: #c93425;
          }
          a:hover {
            color: #c93425;
          }
        </style>
      </helmet>
      <div
        style="
          width: 390px;
          height: 844px;
          box-sizing: border-box;
          background: #a8959d;
          color: #2b1b3d;
          font-family: 'DM Sans', system-ui, sans-serif;
          display: flex;
          flex-direction: column;
          justify-content: flex-end;
        "
      >
        <div
          aria-hidden="true"
          style="
            height: 150px;
            flex-shrink: 0;
            padding: 20px 16px;
            box-sizing: border-box;
            font-family: 'Outfit', system-ui, sans-serif;
            font-weight: 700;
            font-size: 30px;
            color: #6b5661;
          "
        >
          Exclusions
        </div>

        <section
          aria-label="Nouvelle exclusion"
          style="
            flex-grow: 1;
            background: #ffffff;
            border-radius: 32px 32px 0 0;
            padding: 10px 16px 24px;
            display: flex;
            flex-direction: column;
            gap: 18px;
          "
        >
          <span
            aria-hidden="true"
            style="
              align-self: center;
              width: 44px;
              height: 5px;
              border-radius: 999px;
              background: #ffd9cc;
            "
          ></span>
          <div style="display: flex; flex-direction: column; gap: 4px">
            <h1
              style="
                margin: 0;
                font-family: 'Outfit', system-ui, sans-serif;
                font-weight: 700;
                font-size: 24px;
                line-height: 1.15;
              "
            >
              Nouvelle exclusion
            </h1>
            <p
              style="
                margin: 0;
                font-size: 15px;
                line-height: 1.45;
                color: #6b5a7a;
              "
            >
              Deux personnes qui ne doivent pas se tirer : un couple, des frères
              et sœurs…
            </p>
          </div>
          <div style="display: flex; flex-direction: column; gap: 6px">
            <span id="l-Inès" style="font-size: 15px; font-weight: 600"
              >Qui</span
            >
            <button
              aria-labelledby="l-Inès"
              aria-haspopup="listbox"
              style="
                min-height: 56px;
                box-sizing: border-box;
                padding: 6px 12px;
                border: 1px solid #f5b8a5;
                border-radius: 16px;
                background: #ffffff;
                color: #2b1b3d;
                font-family: inherit;
                font-size: 16px;
                font-weight: 600;
                display: flex;
                align-items: center;
                gap: 12px;
                text-align: left;
              "
            >
              <span
                aria-hidden="true"
                style="
                  width: 40px;
                  height: 40px;
                  border-radius: 50%;
                  background: linear-gradient(
                    150deg,
                    #ffffff 0%,
                    #ffe9a8 42%,
                    #f4b82e 135%
                  );
                  box-shadow:
                    0 0 0 2px #ffffff,
                    0 3px 8px rgba(90, 40, 60, 0.22);
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  font-size: 18px;
                  flex-shrink: 0;
                "
                >🍭</span
              ><span style="flex-grow: 1">Inès</span
              ><span style="color: #6b5a7a; display: flex"
                ><svg
                  aria-hidden="true"
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="m6 9 6 6 6-6" /></svg
              ></span>
            </button>
          </div>
          <div style="display: flex; flex-direction: column; gap: 6px">
            <span id="l-Louis" style="font-size: 15px; font-weight: 600"
              >Ne tire pas</span
            >
            <button
              aria-labelledby="l-Louis"
              aria-haspopup="listbox"
              style="
                min-height: 56px;
                box-sizing: border-box;
                padding: 6px 12px;
                border: 1px solid #f5b8a5;
                border-radius: 16px;
                background: #ffffff;
                color: #2b1b3d;
                font-family: inherit;
                font-size: 16px;
                font-weight: 600;
                display: flex;
                align-items: center;
                gap: 12px;
                text-align: left;
              "
            >
              <span
                aria-hidden="true"
                style="
                  width: 40px;
                  height: 40px;
                  border-radius: 50%;
                  background: linear-gradient(
                    150deg,
                    #ffffff 0%,
                    #ffe9a8 42%,
                    #f4b82e 135%
                  );
                  box-shadow:
                    0 0 0 2px #ffffff,
                    0 3px 8px rgba(90, 40, 60, 0.22);
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  font-size: 18px;
                  flex-shrink: 0;
                "
                >🎄</span
              ><span style="flex-grow: 1">Louis</span
              ><span style="color: #6b5a7a; display: flex"
                ><svg
                  aria-hidden="true"
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="m6 9 6 6 6-6" /></svg
              ></span>
            </button>
          </div>
          <div
            style="
              display: flex;
              align-items: center;
              gap: 12px;
              min-height: 48px;
            "
          >
            <span style="flex-grow: 1; font-size: 16px; font-weight: 600"
              >Dans les deux sens</span
            >
            <button
              role="switch"
              aria-checked="true"
              aria-label="Dans les deux sens"
              style="
                width: 48px;
                height: 44px;
                padding: 0;
                border: 0;
                background: transparent;
                display: flex;
                align-items: center;
              "
            >
              <span
                style="
                  width: 48px;
                  height: 28px;
                  border-radius: 999px;
                  background: #0b7a5b;
                  display: flex;
                  align-items: center;
                "
                ><span
                  style="
                    width: 24px;
                    height: 24px;
                    border-radius: 50%;
                    background: #ffffff;
                    margin-left: 20px;
                  "
                ></span
              ></span>
            </button>
          </div>
          <p
            style="
              margin: 0;
              padding: 12px 14px;
              border-radius: 18px;
              background: #dcf7ee;
              color: #0b7a5b;
              font-size: 15px;
              line-height: 1.4;
            "
          >
            <strong>Inès et Louis</strong> ne se tireront jamais l’un l’autre.
          </p>
          <div
            style="
              margin-top: auto;
              display: flex;
              flex-direction: column;
              gap: 6px;
            "
          >
            <button
              style="
                width: 100%;
                height: 52px;
                border: 0;
                border-radius: 16px;
                background: #d93a2b;
                color: #ffffff;
                font-family: inherit;
                font-size: 17px;
                font-weight: 700;
              "
            >
              Ajouter l’exclusion
            </button>
            <a
              href="GroupeExclusions.dc.html"
              style="
                height: 46px;
                border-radius: 16px;
                color: #2b1b3d;
                font-size: 16px;
                font-weight: 600;
                text-decoration: none;
                display: flex;
                align-items: center;
                justify-content: center;
              "
              >Annuler</a
            >
          </div>
        </section>
      </div>
    </x-dc>
    <script
      type="text/x-dc"
      data-dc-script
      data-props='{"$preview":{"width":390,"height":844}}'
    >
      class Component extends DCLogic {
      renderVals() {
      return {};
      }
      }
    </script>
  </body>
</html>
