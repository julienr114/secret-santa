<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Panneau — nouvel organisateur</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <link
          href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap"
          rel="stylesheet"
        />
        <style>
          body {
            margin: 0;
          }
          a {
            color: #c93425;
          }
          a:hover {
            color: #c93425;
          }
        </style>
      </helmet>
      <div
        style="
          width: 390px;
          height: 844px;
          box-sizing: border-box;
          background: #a8959d;
          color: #2b1b3d;
          font-family: 'DM Sans', system-ui, sans-serif;
          display: flex;
          flex-direction: column;
          justify-content: flex-end;
        "
      >
        <div
          aria-hidden="true"
          style="
            height: 280px;
            flex-shrink: 0;
            padding: 20px 16px;
            box-sizing: border-box;
            font-family: 'Outfit', system-ui, sans-serif;
            font-weight: 700;
            font-size: 30px;
            color: #6b5661;
          "
        >
          Réglages
        </div>

        <section
          aria-label="Nouvel organisateur"
          style="
            flex-grow: 1;
            background: #ffffff;
            border-radius: 32px 32px 0 0;
            padding: 10px 16px 24px;
            display: flex;
            flex-direction: column;
            gap: 18px;
          "
        >
          <span
            aria-hidden="true"
            style="
              align-self: center;
              width: 44px;
              height: 5px;
              border-radius: 999px;
              background: #ffd9cc;
            "
          ></span>
          <div style="display: flex; flex-direction: column; gap: 4px">
            <h1
              style="
                margin: 0;
                font-family: 'Outfit', system-ui, sans-serif;
                font-weight: 700;
                font-size: 24px;
                line-height: 1.15;
              "
            >
              Nouvel organisateur
            </h1>
            <p
              style="
                margin: 0;
                font-size: 15px;
                line-height: 1.45;
                color: #6b5a7a;
              "
            >
              Il pourra gérer Famille Camille comme toi : membres, tirage,
              envois.
            </p>
          </div>
          <div style="display: flex; flex-direction: column; gap: 6px">
            <label for="oe" style="font-size: 15px; font-weight: 600"
              >Son adresse email</label
            >
            <input
              id="oe"
              type="email"
              placeholder="prenom@exemple.fr"
              style="
                height: 48px;
                box-sizing: border-box;
                padding: 0 12px;
                border: 2px solid #d93a2b;
                border-radius: 16px;
                background: #ffffff;
                color: #2b1b3d;
                font-family: inherit;
                font-size: 16px;
              "
            />
            <p
              style="
                margin: 0;
                font-size: 13px;
                line-height: 1.4;
                color: #6b5a7a;
              "
            >
              Il lui suffira de se connecter avec cette adresse : aucun mot de
              passe à transmettre.
            </p>
          </div>
          <div
            style="
              display: flex;
              align-items: flex-start;
              gap: 10px;
              font-size: 14px;
              line-height: 1.45;
              color: #6b5a7a;
            "
          >
            <span aria-hidden="true" style="display: flex; margin-top: 1px"
              ><svg
                aria-hidden="true"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect x="4" y="11" width="16" height="10" rx="2" />
                <path d="M8 11V7a4 4 0 0 1 8 0v4" /></svg
            ></span>
            <span>Comme toi, il ne verra pas les résultats du tirage.</span>
          </div>
          <div
            style="
              margin-top: auto;
              display: flex;
              flex-direction: column;
              gap: 6px;
            "
          >
            <button
              style="
                width: 100%;
                height: 52px;
                border: 0;
                border-radius: 16px;
                background: #d93a2b;
                color: #ffffff;
                font-family: inherit;
                font-size: 17px;
                font-weight: 700;
              "
            >
              Ajouter
            </button>
            <a
              href="GroupeReglages.dc.html"
              style="
                height: 46px;
                border-radius: 16px;
                color: #2b1b3d;
                font-size: 16px;
                font-weight: 600;
                text-decoration: none;
                display: flex;
                align-items: center;
                justify-content: center;
              "
              >Annuler</a
            >
          </div>
        </section>
      </div>
    </x-dc>
    <script
      type="text/x-dc"
      data-dc-script
      data-props='{"$preview":{"width":390,"height":844}}'
    >
      class Component extends DCLogic {
      renderVals() {
      return {};
      }
      }
    </script>
  </body>
</html>
