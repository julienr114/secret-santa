      <button role="radio" aria-checked="false" style="height: 40px; border: 0; border-radius: 10px; background: transparent; color: #6b5a7a; font-family: inherit; font-size: 14px; font-weight: 600">Nouveau tirage</button>
    </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">

        <p style="margin: 0">Inès, le tirage est fait ! 🎁 Ouvre ton lien pour découvrir à qui tu offres un cadeau :</p>
        <p style="margin: 0; font-weight: 600; color: #c93425">under-the-tree.party/p/aIFR…</p>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">

      <p style="margin: 0; padding: 0 4px; display: flex; justify-content: space-between; font-size: 13px; color: #6b5a7a"><span>Ajouté sous le message.</span><span>0 / 500</span></p>
    </div>
    <ul style="list-style: none; margin: 0 -16px; padding: 0; background: #ffffff; border-top: 1px solid #ffd9cc; border-bottom: 1px solid #ffd9cc">
