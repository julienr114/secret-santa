<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Mes pistes — une idée précise</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <link
          href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap"
          rel="stylesheet"
        />
        <style>
          body {
            margin: 0;
          }
          a {
            color: #c93425;
          }
          a:hover {
            color: #c93425;
          }
        </style>
      </helmet>
      <div
        style="
          width: 390px;
          height: 844px;
          box-sizing: border-box;
          background: #fff6f1;
          color: #2b1b3d;
          font-family: 'DM Sans', system-ui, sans-serif;
          display: flex;
          flex-direction: column;
        "
      >
        <header
          style="
            height: 56px;
            flex-shrink: 0;
            box-sizing: border-box;
            border-bottom: 1px solid #ffd9cc;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding: 0 12px;
          "
        >
          <div>
            <button
              aria-label="Retour"
              style="
                width: 44px;
                height: 44px;
                border: 0;
                background: transparent;
                color: #2b1b3d;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 0;
              "
            >
              <svg
                aria-hidden="true"
                width="22"
                height="22"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="m15 18-6-6 6-6" />
              </svg>
            </button>
          </div>
          <div
            style="
              display: flex;
              align-items: center;
              gap: 6px;
              font-family: 'Outfit', system-ui, sans-serif;
              font-weight: 700;
              font-size: 18px;
              color: #c93425;
            "
          >
            <svg
              aria-hidden="true"
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="currentColor"
            >
              <path
                d="M12 2l2.2 7.8L22 12l-7.8 2.2L12 22l-2.2-7.8L2 12l7.8-2.2z"
              />
            </svg>
            Under the Tree
          </div>
          <button
            aria-label="Menu"
            style="
              justify-self: end;
              width: 44px;
              height: 44px;
              border: 0;
              background: transparent;
              color: #2b1b3d;
              display: flex;
              align-items: center;
              justify-content: center;
              padding: 0;
            "
          >
            <svg
              aria-hidden="true"
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            >
              <path d="M4 6h16M4 12h16M4 18h16" />
            </svg>
          </button>
        </header>

        <main
          style="
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 24px;
            padding: 20px 16px 24px;
          "
        >
          <div style="display: flex; flex-direction: column; gap: 4px">
            <nav
              aria-label="Tu es ici"
              style="
                margin: -14px 0 -12px;
                display: flex;
                align-items: center;
                gap: 6px;
                color: #6b5a7a;
              "
            >
              <a
                href="#"
                style="
                  min-height: 44px;
                  display: flex;
                  align-items: center;
                  font-size: 14px;
                  font-weight: 600;
                  color: #6b5a7a;
                  text-decoration: none;
                "
                >Famille Camille</a
              ><span aria-hidden="true">·</span
              ><a
                href="#"
                style="
                  min-height: 44px;
                  display: flex;
                  align-items: center;
                  font-size: 14px;
                  font-weight: 600;
                  color: #6b5a7a;
                  text-decoration: none;
                "
                >Noël 2026</a
              >
            </nav>
            <h1
              style="
                margin: 0;
                font-family: 'Outfit', system-ui, sans-serif;
                font-weight: 700;
                font-size: 30px;
                line-height: 1.1;
              "
            >
              Modifier l’idée
            </h1>
            <p
              style="
                margin: 0;
                font-size: 15px;
                line-height: 1.45;
                color: #6b5a7a;
              "
            >
              Une idée courte, et un lien si tu en as un.
            </p>
          </div>
          <div style="display: flex; flex-direction: column; gap: 6px">
            <label
              for="idee"
              style="
                margin: 0;
                padding: 0 4px;
                font-family: inherit;
                font-size: 12px;
                font-weight: 700;
                letter-spacing: 0.04em;
                text-transform: uppercase;
                color: #6b5a7a;
              "
              >Idée</label
            >
            <textarea
              id="idee"
              rows="2"
              placeholder="Un livre, des chaussettes…"
              style="
                width: 100%;
                min-height: 72px;
                box-sizing: border-box;
                padding: 12px;
                border: 1px solid #f5b8a5;
                border-radius: 16px;
                background: #ffffff;
                color: #2b1b3d;
                font-family: inherit;
                font-size: 16px;
                line-height: 1.45;
                resize: none;
              "
            >
Un jeu de société pour deux</textarea>
            <p
              style="
                margin: 0;
                padding: 0 4px;
                display: flex;
                justify-content: space-between;
                gap: 12px;
                font-size: 13px;
                line-height: 1.4;
                color: #6b5a7a;
              "
            >
              <span></span><span style="flex-shrink: 0">27 / 200</span>
            </p>
          </div>
          <div style="display: flex; flex-direction: column; gap: 6px">
            <label
              for="lien"
              style="
                margin: 0;
                padding: 0 4px;
                font-family: inherit;
                font-size: 12px;
                font-weight: 700;
                letter-spacing: 0.04em;
                text-transform: uppercase;
                color: #6b5a7a;
              "
              >Lien
              <span
                style="
                  font-weight: 600;
                  text-transform: none;
                  letter-spacing: 0;
                "
                >(facultatif)</span
              ></label
            >
            <input
              id="lien"
              type="text"
              value="https://boutique-jeux.example/duo"
              placeholder="https://…"
              style="
                width: 100%;
                height: 48px;
                box-sizing: border-box;
                padding: 0 12px;
                border: 1px solid #f5b8a5;
                border-radius: 16px;
                background: #ffffff;
                color: #2b1b3d;
                font-family: inherit;
                font-size: 16px;
              "
            />
            <p
              style="
                margin: 0;
                padding: 0 4px;
                font-size: 13px;
                line-height: 1.4;
                color: #6b5a7a;
              "
            >
              Colle l’adresse d’une page : il s’ouvrira dans un nouvel onglet.
            </p>
          </div>
          <a
            href="#"
            style="
              align-self: flex-start;
              min-height: 44px;
              display: flex;
              align-items: center;
              font-size: 16px;
              font-weight: 600;
              color: #c93425;
              text-decoration: none;
            "
            >Supprimer l’idée</a
          >
        </main>
        <footer
          style="
            flex-shrink: 0;
            background: #ffffff;
            border-top: 1px solid #ffd9cc;
            padding: 14px 16px 20px;
          "
        >
          <button
            style="
              width: 100%;
              height: 52px;
              border: 0;
              border-radius: 16px;
              background: #d93a2b;
              color: #ffffff;
              font-family: inherit;
              font-size: 17px;
              font-weight: 700;
            "
          >
            Valider
          </button>
        </footer>
      </div>
    </x-dc>
    <script
      type="text/x-dc"
      data-dc-script
      data-props='{"$preview":{"width":390,"height":900}}'
    >
      class Component extends DCLogic {
      renderVals() {
      return {};
      }
      }
    </script>
  </body>
</html>
