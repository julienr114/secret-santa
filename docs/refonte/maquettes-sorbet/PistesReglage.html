<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Réglages du groupe — pistes de cadeaux</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <link
          href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap"
          rel="stylesheet"
        />
        <style>
          body {
            margin: 0;
          }
          a {
            color: #c93425;
          }
          a:hover {
            color: #c93425;
          }
        </style>
      </helmet>
      <div
        style="
          width: 390px;
          height: 844px;
          box-sizing: border-box;
          background: #a8959d;
          color: #2b1b3d;
          font-family: 'DM Sans', system-ui, sans-serif;
          display: flex;
          flex-direction: column;
          justify-content: flex-end;
        "
      >
        <div
          aria-hidden="true"
          style="
            height: 250px;
            flex-shrink: 0;
            padding: 20px 16px;
            box-sizing: border-box;
            font-family: 'Outfit', system-ui, sans-serif;
            font-weight: 700;
            font-size: 30px;
            color: #6b5661;
          "
        >
          Réglages
        </div>
        <section
          aria-label="Pistes de cadeaux"
          style="
            flex-grow: 1;
            background: #ffffff;
            border-radius: 32px 32px 0 0;
            padding: 10px 16px 24px;
            display: flex;
            flex-direction: column;
            gap: 18px;
          "
        >
          <span
            aria-hidden="true"
            style="
              align-self: center;
              width: 44px;
              height: 5px;
              border-radius: 999px;
              background: #ffd9cc;
            "
          ></span>
          <div style="display: flex; flex-direction: column; gap: 4px">
            <h1
              style="
                margin: 0;
                font-family: 'Outfit', system-ui, sans-serif;
                font-weight: 700;
                font-size: 24px;
                line-height: 1.15;
              "
            >
              Pistes de cadeaux
            </h1>
            <p
              style="
                margin: 0;
                font-size: 15px;
                line-height: 1.45;
                color: #6b5a7a;
              "
            >
              Ce que chacun peut noter pour aider la personne qui lui offre un
              cadeau.
            </p>
          </div>
          <div
            role="radiogroup"
            aria-label="Pistes de cadeaux"
            style="
              border: 1px solid #ffd9cc;
              border-radius: 18px;
              overflow: hidden;
              display: flex;
              flex-direction: column;
            "
          >
            <label
              style="
                display: flex;
                align-items: center;
                gap: 12px;
                min-height: 56px;
                padding: 10px 14px;
                box-sizing: border-box;
              "
            >
              <input
                type="radio"
                name="g"
                style="
                  width: 22px;
                  height: 22px;
                  margin: 0;
                  accent-color: #d93a2b;
                  flex-shrink: 0;
                "
              />
              <span style="display: flex; flex-direction: column; gap: 2px"
                ><span style="font-size: 16px; font-weight: 600"
                  >Portrait et idées précises</span
                ><span
                  style="font-size: 13px; line-height: 1.35; color: #6b5a7a"
                  >Les six questions, les envies du moment, et des idées
                  d’objets</span
                ></span
              > </label
            ><label
              style="
                display: flex;
                align-items: center;
                gap: 12px;
                min-height: 56px;
                padding: 10px 14px;
                box-sizing: border-box;
                border-top: 1px solid #ffd9cc;
                background: #ffe3de;
              "
            >
              <input
                type="radio"
                name="g"
                checked
                style="
                  width: 22px;
                  height: 22px;
                  margin: 0;
                  accent-color: #d93a2b;
                  flex-shrink: 0;
                "
              />
              <span style="display: flex; flex-direction: column; gap: 2px"
                ><span style="font-size: 16px; font-weight: 600"
                  >Portrait seulement</span
                ><span
                  style="font-size: 13px; line-height: 1.35; color: #6b5a7a"
                  >Sans idée d’objet : la surprise reste entière</span
                ></span
              > </label
            ><label
              style="
                display: flex;
                align-items: center;
                gap: 12px;
                min-height: 56px;
                padding: 10px 14px;
                box-sizing: border-box;
                border-top: 1px solid #ffd9cc;
              "
            >
              <input
                type="radio"
                name="g"
                style="
                  width: 22px;
                  height: 22px;
                  margin: 0;
                  accent-color: #d93a2b;
                  flex-shrink: 0;
                "
              />
              <span style="display: flex; flex-direction: column; gap: 2px"
                ><span style="font-size: 16px; font-weight: 600"
                  >Aucune piste</span
                ><span
                  style="font-size: 13px; line-height: 1.35; color: #6b5a7a"
                  >Chacun se débrouille</span
                ></span
              >
            </label>
          </div>
          <div
            style="
              margin-top: auto;
              display: flex;
              flex-direction: column;
              gap: 6px;
            "
          >
            <button
              style="
                width: 100%;
                height: 52px;
                border: 0;
                border-radius: 16px;
                background: #d93a2b;
                color: #ffffff;
                font-family: inherit;
                font-size: 17px;
                font-weight: 700;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
              "
            >
              Valider
            </button>
            <a
              href="#"
              style="
                height: 46px;
                border-radius: 16px;
                color: #2b1b3d;
                font-size: 16px;
                font-weight: 600;
                text-decoration: none;
                display: flex;
                align-items: center;
                justify-content: center;
              "
              >Annuler</a
            >
          </div>
        </section>
      </div>
    </x-dc>
    <script
      type="text/x-dc"
      data-dc-script
      data-props='{"$preview":{"width":390,"height":844}}'
    >
      class Component extends DCLogic {
      renderVals() {
      return {};
      }
      }
    </script>
  </body>
</html>
