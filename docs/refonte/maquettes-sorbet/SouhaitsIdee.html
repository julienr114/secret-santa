<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>
      Ma liste de souhaits — modifier une idée — remplacée par PistesIdee
      (Correction 18)
    </title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <link
          href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap"
          rel="stylesheet"
        />
        <style>
          body {
            margin: 0;
          }
          a {
            color: #c93425;
          }
          a:hover {
            color: #c93425;
          }
        </style>
      </helmet>
      <div
        style="
          width: 390px;
          height: 844px;
          box-sizing: border-box;
          background: #a8959d;
          color: #2b1b3d;
          font-family: 'DM Sans', system-ui, sans-serif;
          display: flex;
          flex-direction: column;
          justify-content: flex-end;
        "
      >
        <div
          aria-hidden="true"
          style="
            height: 230px;
            flex-shrink: 0;
            padding: 20px 16px;
            box-sizing: border-box;
            font-family: 'Outfit', system-ui, sans-serif;
            font-weight: 700;
            font-size: 30px;
            color: #6b5661;
          "
        >
          Ma liste de souhaits
        </div>

        <section
          aria-label="Modifier l’idée"
          style="
            flex-grow: 1;
            background: #ffffff;
            border-radius: 32px 32px 0 0;
            padding: 10px 16px 24px;
            display: flex;
            flex-direction: column;
            gap: 18px;
          "
        >
          <span
            aria-hidden="true"
            style="
              align-self: center;
              width: 44px;
              height: 5px;
              border-radius: 999px;
              background: #ffd9cc;
            "
          ></span>
          <div style="display: flex; flex-direction: column; gap: 4px">
            <h1
              style="
                margin: 0;
                font-family: 'Outfit', system-ui, sans-serif;
                font-weight: 700;
                font-size: 24px;
                line-height: 1.15;
              "
            >
              Modifier l’idée
            </h1>
            <p
              style="
                margin: 0;
                font-size: 15px;
                line-height: 1.45;
                color: #6b5a7a;
              "
            >
              Une idée courte, et un lien si tu en as un.
            </p>
          </div>
          <div style="display: flex; flex-direction: column; gap: 6px">
            <label for="idea" style="font-size: 15px; font-weight: 600"
              >Idée</label
            >
            <input
              id="idea"
              type="text"
              value="Un jeu de société pour deux"
              style="
                height: 48px;
                box-sizing: border-box;
                padding: 0 12px;
                border: 2px solid #d93a2b;
                border-radius: 16px;
                background: #ffffff;
                color: #2b1b3d;
                font-family: inherit;
                font-size: 16px;
              "
            />
            <p
              style="
                margin: 0;
                text-align: right;
                font-size: 13px;
                color: #6b5a7a;
              "
            >
              27 / 200
            </p>
          </div>
          <div style="display: flex; flex-direction: column; gap: 6px">
            <label for="url" style="font-size: 15px; font-weight: 600"
              >Lien
              <span style="font-weight: 400; color: #6b5a7a"
                >(facultatif)</span
              ></label
            >
            <input
              id="url"
              type="url"
              inputmode="url"
              value="https://boutique-jeux.example/duo"
              style="
                height: 48px;
                box-sizing: border-box;
                padding: 0 12px;
                border: 1px solid #f5b8a5;
                border-radius: 16px;
                background: #ffffff;
                color: #2b1b3d;
                font-family: inherit;
                font-size: 16px;
              "
            />
            <p style="margin: 0; font-size: 13px; color: #6b5a7a">
              Colle l’adresse d’une page : il s’ouvrira dans un nouvel onglet.
            </p>
          </div>
          <div
            style="
              margin-top: auto;
              display: flex;
              flex-direction: column;
              gap: 6px;
            "
          >
            <button
              style="
                width: 100%;
                height: 52px;
                border: 0;
                border-radius: 16px;
                background: #d93a2b;
                color: #ffffff;
                font-family: inherit;
                font-size: 17px;
                font-weight: 700;
              "
            >
              Valider
            </button>
            <button
              style="
                width: 100%;
                height: 46px;
                border: 0;
                border-radius: 16px;
                background: transparent;
                color: #961d35;
                font-family: inherit;
                font-size: 16px;
                font-weight: 600;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
              "
            >
              <svg
                aria-hidden="true"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14" /></svg
              >Supprimer l’idée
            </button>
          </div>
        </section>
      </div>
    </x-dc>
    <script
      type="text/x-dc"
      data-dc-script
      data-props='{"$preview":{"width":390,"height":844}}'
    >
      class Component extends DCLogic {
      renderVals() {
      return {};
      }
      }
    </script>
  </body>
</html>
