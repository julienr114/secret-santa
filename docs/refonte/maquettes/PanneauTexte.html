    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="note" style="font-size: 15px; font-weight: 600">Ton mot</label>
      <textarea id="note" rows="3" style="box-sizing: border-box; width: 100%; padding: 10px 12px; border: 2px solid #b8483a; border-radius: 6px; background: #fffdf9; color: #292524; font-family: inherit; font-size: 16px; line-height: 1.4; resize: none">On ouvre les cadeaux après le dessert !</textarea>
      <p style="margin: 0; display: flex; justify-content: space-between; font-size: 13px; color: #57534e"><span>Envoyé tel quel, quelle que soit la langue.</span><span>39 / 500</span></p>
    </div>
    <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 6px">
      <legend style="padding: 0; margin-bottom: 6px; font-size: 15px; font-weight: 600">Où le placer</legend>
      <div style="border: 1px solid #dccbad; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column">
      <label style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 14px; box-sizing: border-box;">
        <input type="radio" name="pos" style="width: 22px; height: 22px; margin: 0; accent-color: #b8483a; flex-shrink: 0">
        <span style="display: flex; flex-direction: column"><span style="font-size: 16px; font-weight: 600">Au-dessus du message</span></span>
      </label>
      <label style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 14px; box-sizing: border-box; border-top: 1px solid #e9dcc5; background: #fbf3f1;">
        <input type="radio" name="pos" checked style="width: 22px; height: 22px; margin: 0; accent-color: #b8483a; flex-shrink: 0">
        <span style="display: flex; flex-direction: column"><span style="font-size: 16px; font-weight: 600">En dessous du message</span></span>
      </label>
      </div>
    </fieldset>
    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 6px">
      <button style="width: 100%; height: 52px; border: 0; border-radius: 6px; background: #b8483a; color: #ffffff; font-family: inherit; font-size: 17px; font-weight: 700">Valider</button>
