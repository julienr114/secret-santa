<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Groupe — nouvelle personne</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#a43a2f}a:hover{color:#8a2f27}
</style>
</helmet>
<div style="width: 390px; height: 900px; box-sizing: border-box; background: #f7f2e9; color: #292524; font-family: 'Nunito', system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="height: 56px; flex-shrink: 0; box-sizing: border-box; border-bottom: 1px solid #dccbad; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 12px">
    <div>
      <button aria-label="Retour" style="width: 44px; height: 44px; border: 0; background: transparent; color: #292524; display: flex; align-items: center; justify-content: center; padding: 0">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </button>
    </div>
    <div style="display: flex; align-items: center; gap: 6px; font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 18px; color: #a43a2f">
      <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.2 7.8L22 12l-7.8 2.2L12 22l-2.2-7.8L2 12l7.8-2.2z"/></svg>
      Under the Tree
    </div>
    <button aria-label="Menu" style="justify-self: end; width: 44px; height: 44px; border: 0; background: transparent; color: #292524; display: flex; align-items: center; justify-content: center; padding: 0">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
  </header>

  <main style="display: flex; flex-direction: column; gap: 24px; padding: 20px 16px 32px">
    <div style="display: flex; align-items: center; gap: 16px">
      <button aria-label="Changer l'avatar" style="position: relative; width: 72px; height: 72px; padding: 0; border: 0; border-radius: 50%; background: #d6e6ef; box-shadow: 0 0 0 1px #94bbd0; font-size: 32px; flex-shrink: 0"><span aria-hidden="true">⛄</span><span aria-hidden="true" style="position: absolute; right: -2px; bottom: -2px; width: 26px; height: 26px; box-sizing: border-box; border-radius: 50%; background: #fffdf9; border: 1px solid #dccbad; color: #57534e; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.800 2.800 0 1 1 4 4L7.500 20.500 2 22l1.500-5.500z"/></svg></span></button>
      <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
        <h1 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 30px; line-height: 1.1">Nouvelle personne</h1>
        <p style="margin: 0; font-size: 15px; color: #57534e">Famille Camille</p>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="fn" style="font-size: 15px; font-weight: 600">Prénom</label>
      <input id="fn" type="text" value="" placeholder="" style="height: 48px; box-sizing: border-box; padding: 0 12px; border: 1px solid #a8a29e; border-radius: 6px; background: #fffdf9; color: #292524; font-family: inherit; font-size: 16px">
      
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="em" style="font-size: 15px; font-weight: 600">Adresse email <span style="font-weight: 400; color: #57534e">(facultatif)</span></label>
      <input id="em" type="text" value="" placeholder="prenom@exemple.fr" style="height: 48px; box-sizing: border-box; padding: 0 12px; border: 1px solid #a8a29e; border-radius: 6px; background: #fffdf9; color: #292524; font-family: inherit; font-size: 16px">
      <p style="margin: 0; font-size: 13px; line-height: 1.4; color: #57534e">Pour lui envoyer son lien. Sans adresse, tu le partageras toi-même par WhatsApp ou SMS.</p>
    </div>
    <section style="display: flex; flex-direction: column; gap: 6px">
      <ul style="list-style: none; margin: 0 -16px; padding: 0; background: #fffdf9; border-top: 1px solid #dccbad; border-bottom: 1px solid #dccbad">
        <li>
          <a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 8px 16px; box-sizing: border-box; text-decoration: none; color: #292524">
            
            <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column">
              <span style="font-weight: 600; font-size: 16px">Langue de ses messages</span>
              
            </span>
            <span style="font-size: 15px; color: #57534e; flex-shrink: 0; max-width: 150px; text-align: right">Français</span><span style="color: #78716c; display: flex; flex-shrink: 0"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></span>
          </a>
        </li>
        <li style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 8px 16px; box-sizing: border-box; border-top: 1px solid #e9dcc5;">
          <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column">
            <span style="font-weight: 600; font-size: 16px">Participe à Noël 2026</span>
            <span style="font-size: 14px; line-height: 1.35; color: #57534e">Le tirage n’a pas encore eu lieu</span>
          </span>
          <button role="switch" aria-checked="true" aria-label="Participe à Noël 2026" style="width: 48px; height: 44px; padding: 0; border: 0; background: transparent; display: flex; align-items: center; flex-shrink: 0"><span style="width: 48px; height: 28px; border-radius: 999px; background: #2f613f; display: flex; align-items: center"><span style="width: 24px; height: 24px; border-radius: 50%; background: #ffffff; margin-left: 20px"></span></span></button>
        </li>
      </ul>
    </section>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <button style="height: 48px; border: 0; border-radius: 6px; background: #b8483a; color: #ffffff; font-family: inherit; font-size: 16px; font-weight: 700">Ajouter</button>
      <button style="height: 46px; border: 0; border-radius: 6px; background: transparent; color: #8a2f27; font-family: inherit; font-size: 15px; font-weight: 600">Ajouter, puis en créer une autre</button>
    </div>
    <p style="margin: 0; text-align: center; font-size: 13px; line-height: 1.4; color: #57534e">Une icône lui est donnée au hasard ; elle pourra la changer.</p>
  </main>
</div>
</x-dc>

return {};
}
}
</script>
</body>
</html>
