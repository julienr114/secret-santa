# Cloudflare Workers configuration. Nitro builds to .output; wrangler
# deploys that output and serves .output/public through the ASSETS binding.
name = "secret-santa"
main = ".output/server/index.mjs"
compatibility_date = "2025-07-15"
compatibility_flags = ["nodejs_compat"]

# Custom domain (bought at Cloudflare Registrar on 2026-11-13). Cloudflare
# creates the DNS record and the certificate. With routes declared, wrangler
# turns the workers.dev address off unless told otherwise: it stays on so
# the links already shared keep working.
workers_dev = true

[[routes]]
pattern = "under-the-tree.party"
custom_domain = true

[assets]
directory = ".output/public"
binding = "ASSETS"

[observability]
enabled = true

# D1 database. Run `wrangler d1 create secret-santa` and paste the id below.
[[d1_databases]]
binding = "DB"
database_name = "secret-santa"
database_id = "1128fa3f-8afe-48ba-b550-f2fae582a685"
migrations_dir = "server/database/migrations"

# Limiting how fast the public routes are called (lot 38 A, README 8),
# per client address: a net against a script, counted roughly and per
# Cloudflare location. `period` can only be 10 or 60 seconds.
# Asking for a login link, a group, an invitation: 10 a minute.
[[ratelimits]]
name = "RATE_ASK"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 10
  period = 60

# Writing on a list opened by its link: 120 a minute.
[[ratelimits]]
name = "RATE_WRITE"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 120
  period = 60

# The live lists (lot 26, README 22.20): one Durable Object per list holds
# its WebSocket connections, with hibernation (a list nobody watches
# costs nothing). SQLite storage, the only kind the free plan allows; the
# object stores nothing.
[[durable_objects.bindings]]
name = "LIST_ROOM"
class_name = "ListRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ListRoom"]

[vars]
NUXT_PUBLIC_BASE_URL = "https://under-the-tree.party"

# Every morning at 8:00 UTC: reminders to the organisers before an
# exchange (server/plugins/reminders.ts); every 15 minutes, « Devine
# qui » closes and reveals at most a quarter of an hour late
# (server/plugins/guesses.ts). Free plan: up to 5 crons.
[triggers]
crons = ["0 8 * * *", "*/15 * * * *"]
