# Cloudflare Workers configuration. Nitro builds to .output; wrangler
# deploys that output and serves .output/public through the ASSETS binding.
name = "secret-santa"
main = ".output/server/index.mjs"
compatibility_date = "2025-07-15"
compatibility_flags = ["nodejs_compat"]

# Custom domain (bought at Cloudflare Registrar on 2026-11-13). Cloudflare
# creates the DNS record and the certificate. With routes declared, wrangler
# turns the workers.dev address off unless told otherwise: it stays on so
# the links already shared keep working.
workers_dev = true

[[routes]]
pattern = "under-the-tree.party"
custom_domain = true

[assets]
directory = ".output/public"
binding = "ASSETS"

[observability]
enabled = true

# D1 database. Run `wrangler d1 create secret-santa` and paste the id below.
[[d1_databases]]
binding = "DB"
database_name = "secret-santa"
database_id = "1128fa3f-8afe-48ba-b550-f2fae582a685"
migrations_dir = "server/database/migrations"

[vars]
NUXT_PUBLIC_BASE_URL = "https://under-the-tree.party"

# Every morning at 8:00 UTC: reminders to the organisers before an
# exchange (server/plugins/reminders.ts); every hour, « Devine qui »
# closes and reveals on time (server/plugins/guesses.ts). Free plan: up
# to 5 crons.
[triggers]
crons = ["0 8 * * *", "30 * * * *"]
